function board(){const active=deals.filter(d=>typeof d.stage==='number');return `<div class="gv-page-head"><div><h1>영업 보드</h1><p>전체 DB 중 영업으로 등록한 건만 표시합니다.</p></div><div class="gv-actions"><button id="gv-history">변경 이력</button><button class="gv-primary" id="gv-select-db">${icon('plus')}DB에서 추가</button></div></div><div class="gv-board-top"><span>해외 진출·마케팅 영업 <span class="gv-chip">예시 ${active.length}건</span></span><span>예상계약 합계 <strong class="gv-number">${sumMoney(active)}</strong></span></div><div class="gv-board" aria-label="단계별 영업 보드">${stages.map((stage,i)=>{const cards=active.filter(d=>d.stage===i);return `<section class="gv-lane" data-drop="${i}" aria-label="${stage}"><div class="gv-lane-head"><span>${stage}</span><span class="gv-chip">${cards.length}</span></div><div class="gv-lane-sum">${sumMoney(cards)}</div>${cards.map(d=>dealCard(d)).join('')}${!cards.length?'<div class="gv-small gv-muted" style="padding:15px 5px">카드를 여기로 이동</div>':''}</section>`}).join('')}</div><div class="gv-outcomes"><div class="gv-outcome" data-drop="won">수주 완료 · ${deals.filter(d=>d.stage==='won').length}</div><div class="gv-outcome" data-drop="hold">보류·드랍 · ${deals.filter(d=>d.stage==='hold').length}</div></div><p class="gv-board-help">카드를 끌어서 이동 · 카드 아래 선택 메뉴로도 단계 변경 가능</p>`}
function dealCard(d){const r=byId(d.id);return `<article class="gv-deal ${grabbed===d.id?'is-grabbed':''}" draggable="true" data-drag="${d.id}" aria-label="${esc(r.name)} 영업 기회"><div class="gv-deal-title"><button class="gv-company" data-detail="${r.id}">${esc(r.name)}</button><button class="gv-handle" data-grab="${r.id}" aria-label="${esc(r.name)} 카드 이동" aria-pressed="${grabbed===r.id}">${icon('grip-vertical')}</button></div><div class="gv-deal-product">${esc(d.service)}</div><div class="gv-deal-money">${money(d.value)}</div><div class="gv-deal-revenue">회사 연매출 ${rev(r)}</div><div class="gv-deal-next ${d.due==='10/31'?'overdue':''}">${icon('calendar-clock')}<span>${d.due} ${esc(d.next)}</span></div><div class="gv-deal-bottom"><span class="gv-avatar" data-tooltip="담당자 ${r.owner}">${r.owner.slice(0,1)}</span><select class="gv-stage-small" data-stage="${d.id}" aria-label="${esc(r.name)} 영업 단계">${stages.map((s,i)=>`<option value="${i}" ${d.stage===i?'selected':''}>${s}</option>`).join('')}<option value="won">수주 완료</option><option value="hold">보류·드랍</option></select></div></article>`}

function connections(){return `<div class="gv-page-head"><div><h1>수집·연결</h1><p>원본 보관부터 CRM 반영까지, 어느 단계에서 막혔는지 확인합니다.</p></div><span class="gv-chip warn">새 시스템 연결 전 · 설계 예시</span></div><div class="gv-connect-flow"><div class="gv-connect-step"><strong>원본 보관</strong><span>API·폼·엑셀 원본</span></div><div class="gv-connect-step"><strong>회사·브랜드 정리</strong><span>ID 연결·중복 검토</span></div><div class="gv-connect-step"><strong>매출 근거 확인</strong><span>법인·연도·출처</span></div><div class="gv-connect-step"><strong>영업에 활용</strong><span>담당자·다음 행동</span></div></div><div class="gv-source-row"><div><strong>Glovek 관리자 원장</strong><small>지금은 기존 GPT가 매일 06:00 시트에 반영</small></div><div>신규 시스템: 이벤트 우선<small>지원 여부 확인 전에는 주기 조회 방식</small></div><span class="gv-chip">연결 설계</span></div><div class="gv-source-row"><div><strong>보유 엑셀 DB</strong><small>고객사·크리에이터 7만 건 이상 규모</small></div><div>원본 → 열 매핑 → 미리보기<small>실제 행 수·중복은 가져올 때 검증</small></div><button id="gv-import">열 매핑 보기</button></div><div class="gv-source-row"><div><strong>커뮤니케이션</strong><small>메일·통화·메모를 업체와 연결</small></div><div>발신과 고객 회신 구분<small>동명이인·공용 도메인 모호하면 검토 대기</small></div><span class="gv-chip">읽기 수집부터</span></div><div class="gv-logbox"><h3>처리 결과 예시</h3><div class="gv-logline"><span>원본 수집</span><span>16행</span></div><div class="gv-logline"><span>회사·브랜드 / 크리에이터</span><span>12 / 4행</span></div><div class="gv-logline"><span>회사 연매출 확인값 / 미확인</span><span>예시 ${records.filter(r=>r.type==='회사·브랜드'&&r.revenue!==null).length} / ${records.filter(r=>r.type==='회사·브랜드'&&r.revenue===null).length}행</span></div><div class="gv-logline"><span>실패한 수집은 마지막 성공 시각 보존</span><span class="gv-chip">실패 건만 재처리</span></div></div>`}
function render(){root.style.setProperty('--gv-row',design.density==='압축'?'37px':'46px');root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===ui.page?'page':'false'));screen.innerHTML=({database,pipeline:board,activities,connections}[ui.page]||database)();wire();wirePointer();icons();if(ui.detail)renderDetail()}
function wire(){screen.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ui.preset=b.dataset.preset;ui.query='';render();save()});screen.querySelector('#gv-query')?.addEventListener('input',e=>{const pos=e.target.selectionStart;ui.query=e.target.value;render();const input=screen.querySelector('#gv-query');input.focus();input.setSelectionRange(pos,pos)});screen.querySelector('#gv-type')?.addEventListener('change',e=>{ui.type=e.target.value;render();save()});screen.querySelector('#gv-revenue')?.addEventListener('change',e=>{ui.revenue=e.target.value;render();save()});screen.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{c.checked?ui.selected.add(c.dataset.check):ui.selected.delete(c.dataset.check);render()});screen.querySelector('#gv-all')?.addEventListener('change',e=>{filtered().forEach(r=>e.target.checked?ui.selected.add(r.id):ui.selected.delete(r.id));render()});screen.querySelectorAll('[data-owner]').forEach(s=>s.onchange=()=>{byId(s.dataset.owner).owner=s.value;toast('시안의 담당자 배정을 반영했습니다.');save()});screen.querySelector('#gv-to-deal')?.addEventListener('click',convert);screen.querySelector('#gv-select-db')?.addEventListener('click',()=>{ui.page='database';render();save()});screen.querySelector('#gv-clear')?.addEventListener('click',()=>{ui.query='';ui.type='전체 유형';ui.revenue='전체 매출';ui.preset='전체 DB';render()});screen.querySelector('#gv-history')?.addEventListener('click',()=>openDialog('단계 변경 이력',`<p>시안에서 바꾼 이력입니다.</p>${ui.history.length?ui.history.map(h=>`<div class="gv-logline">${esc(h)}</div>`).join(''):'<p>아직 단계 변경 이력이 없습니다.</p>'}<div class="gv-form-row"><button data-close>닫기</button></div>`));screen.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail,b));screen.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{deals.find(d=>d.id===c.dataset.task).done=c.checked;render();toast('시안의 할 일 상태를 반영했습니다.')});screen.querySelector('#gv-import')?.addEventListener('click',importPreview);screen.querySelectorAll('[data-stage]').forEach(s=>s.onchange=()=>requestMove(s.dataset.stage,s.value));screen.querySelectorAll('[data-drag]').forEach(c=>{c.addEventListener('dragstart',e=>{dragging=c.dataset.drag;e.dataTransfer.setData('text/plain',dragging);e.dataTransfer.effectAllowed='move'});c.addEventListener('dragend',()=>{dragging=null;root.querySelectorAll('.is-over').forEach(x=>x.classList.remove('is-over'))})});screen.querySelectorAll('[data-drop]').forEach(l=>{l.addEventListener('dragover',e=>{e.preventDefault();l.classList.add('is-over')});l.addEventListener('dragleave',()=>l.classList.remove('is-over'));l.addEventListener('drop',e=>{e.preventDefault();l.classList.remove('is-over');const id=e.dataTransfer.getData('text/plain')||dragging;if(deals.some(d=>d.id===id))requestMove(id,l.dataset.drop)})});screen.querySelectorAll('[data-grab]').forEach(b=>b.addEventListener('keydown',e=>{const d=deals.find(d=>d.id===b.dataset.grab);if(e.key===' '||e.key==='Enter'){e.preventDefault();if(grabbed===d.id){grabbed=null;toast('카드를 놓았습니다.',!!ui.lastMove)}else{grabbed=d.id;toast('카드를 잡았습니다. 좌우 방향키로 단계 이동, Space로 놓기.')}render();screen.querySelector(`[data-grab="${d.id}"]`)?.focus()}else if(grabbed===d.id&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();requestMove(d.id,Math.max(0,Math.min(4,d.stage+(e.key==='ArrowRight'?1:-1))));screen.querySelector(`[data-grab="${d.id}"]`)?.focus()}}))}
function wirePointer(){screen.querySelectorAll('[data-grab]').forEach(b=>b.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();const id=b.dataset.grab,x=e.clientX,y=e.clientY;let moved=false;b.setPointerCapture(e.pointerId);const clear=()=>screen.querySelectorAll('.is-over').forEach(z=>z.classList.remove('is-over'));b.onpointermove=p=>{if(Math.hypot(p.clientX-x,p.clientY-y)>8)moved=true;if(!moved)return;b.closest('[data-drag]').classList.add('is-grabbed');clear();document.elementFromPoint(p.clientX,p.clientY)?.closest('[data-drop]')?.classList.add('is-over')};b.onpointerup=p=>{const lane=document.elementFromPoint(p.clientX,p.clientY)?.closest('[data-drop]');b.onpointermove=null;b.onpointerup=null;clear();if(b.hasPointerCapture(p.pointerId))b.releasePointerCapture(p.pointerId);b.closest('[data-drag]')?.classList.remove('is-grabbed');if(moved&&lane)requestMove(id,lane.dataset.drop)};b.onpointercancel=()=>{clear();b.onpointermove=null;b.onpointerup=null;b.closest('[data-drag]')?.classList.remove('is-grabbed')}})}
function openDialog(title,content){dialog.innerHTML=`<h2 id="gv-dialog-title">${esc(title)}</h2>${content}`;dialog.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{dialog.close();render()});if(!dialog.open)dialog.showModal();queueMicrotask(()=>{const form=dialog.querySelector('form'),handler=form?.onsubmit;if(!handler)return;const submit=form.querySelector('button[type="submit"]');if(!submit)return;submit.type='button';submit.onclick=e=>{e.preventDefault();if(form.reportValidity())handler.call(form,e)};form.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();if(form.reportValidity())handler.call(form,e)}})})}
function convert(){const selected=[...ui.selected].map(byId),eligible=selected.filter(r=>r.type==='회사·브랜드'&&r.contact&&!deals.some(d=>d.id===r.id));if(!eligible.length){toast('연락처가 확인된 회사·브랜드 중 아직 영업에 등록하지 않은 DB를 선택해 주세요.');return}openDialog('영업으로 등록',`<p>${eligible.map(r=>esc(r.name)).join(', ')} · ${eligible.length}건<br>기존 영업 건과 크리에이터는 중복 등록하지 않습니다.</p><form id="gv-convert-form"><label class="gv-form-label">담당자<select name="owner" required><option value="">담당자를 선택해 주세요</option>${owners.slice(1).map(o=>`<option>${o}</option>`).join('')}</select></label><label class="gv-form-label">다음 행동<input name="next" placeholder="예: 내일 오전 10시 니즈 확인 전화" required></label><p class="gv-small">매출 미확인은 그대로 보존합니다. 확인되지 않은 금액을 채우지 않습니다.</p><div class="gv-form-error" role="alert"></div><div class="gv-form-row"><button type="button" data-close>취소</button><button class="gv-primary" type="submit">${eligible.length}건 등록</button></div></form>`);dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const owner=dialog.querySelector('[name="owner"]').value,next=dialog.querySelector('[name="next"]').value.trim();if(!owner||!next)return;eligible.forEach(r=>{r.owner=owner;r.next=next;deals.push({id:r.id,stage:0,value:null,service:'영업 내용 확인',next,due:'예정',proposal:false})});dialog.close();ui.selected.clear();ui.page='pipeline';render();save();toast('시안에서 영업 기회를 등록했습니다.')}}
function requestMove(id,target){target=/^\d+$/.test(String(target))?Number(target):target;const d=deals.find(d=>d.id===id);if(!d||d.stage===target)return;const needMoney=(target==='won'||target>=3)&&!d.value,needScope=(target===4||target==='won')&&!d.proposal,needReason=target==='hold';if(needMoney||needScope||needReason){openDialog(target==='won'?'수주 완료 확인':needReason?'보류·드랍 사유':'단계 이동에 필요한 정보',`<p>${esc(byId(id).name)} → ${esc(typeof target==='number'?stages[target]:target==='won'?'수주 완료':'보류·드랍')}</p><form id="gv-gate-form">${needMoney?'<label class="gv-form-label">예상계약금액 / 확정계약금액 (원)<input name="value" type="number" min="1" step="1" required placeholder="회사 연매출과 다른 금액입니다"></label>':''}${needScope?'<label class="gv-form-label"><span><input name="scope" type="checkbox" required> 견적·계약 범위를 확인했습니다</span></label>':''}${needReason?'<label class="gv-form-label">보류·드랍 사유<input name="reason" required placeholder="예: 일정 미정, 다음 분기 재검토"></label>':''}<div class="gv-form-row"><button type="button" data-close>취소</button><button class="gv-primary" type="submit">단계 이동</button></div></form>`);dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const value=dialog.querySelector('[name="value"]')?.value,reason=dialog.querySelector('[name="reason"]')?.value;if(value)d.value=Number(value);if(needScope)d.proposal=true;if(reason)d.reason=reason;dialog.close();move(id,target)}}else move(id,target)}
function move(id,target){ui.lastMove=JSON.parse(JSON.stringify(deals));const d=deals.find(d=>d.id===id),from=typeof d.stage==='number'?stages[d.stage]:d.stage;d.stage=target;const to=typeof target==='number'?stages[target]:target==='won'?'수주 완료':'보류·드랍';ui.history.unshift(`${byId(id).name} · ${from} → ${to} · 내가 변경`);render();save();toast(`${byId(id).name} → ${to} · 시안에 반영`,true)}
function openDetail(id,trigger){focusReturn=trigger;ui.detail=id;renderDetail();detail.hidden=false;root.classList.add('detail-open');detail.querySelector('[data-close-detail]').focus();save()}
function closeDetail(){ui.detail=null;detail.hidden=true;root.classList.remove('detail-open');focusReturn?.focus();save()}
function renderDetail(){const r=byId(ui.detail);if(!r)return;const d=deals.find(x=>x.id===r.id);detail.innerHTML=`<div class="gv-detail-head"><div><span class="gv-small gv-muted">${esc(r.type)} / 상세</span><h2>${esc(r.name)}</h2><p class="gv-muted gv-small">${esc(r.legal)}</p></div><button class="gv-quiet" data-close-detail aria-label="업체 상세 닫기">${icon('x')}</button></div><span class="gv-chip ${r.revenue===null?'warn':'good'}">${r.type==='크리에이터'?'프로필 검토':r.revenue===null?'매출 근거 확인 필요':'예시 매출값 보유'}</span><div class="gv-contact">연락처: ${r.contact?'010-****-1234':'미확인'}<br>이메일: ${r.contact?'contact@example.com':'미확인'} <span class="gv-muted">(예시)</span></div><section class="gv-section"><h3>기본 정보</h3><dl class="gv-kv"><dt>유입일시</dt><dd>${r.inflow} KST</dd><dt>유입 출처</dt><dd>${esc(r.source)}</dd><dt>담당자</dt><dd>${esc(r.owner)}</dd><dt>최근 커뮤</dt><dd>${esc(r.comm)}</dd></dl></section><section class="gv-section"><h3>회사 매출 · 영업 금액</h3><dl class="gv-kv"><dt>회사 연매출</dt><dd>${r.type==='크리에이터'?'해당 없음':rev(r)}</dd><dt>기준연도·범위</dt><dd>${r.revenue===null?'미확인':'2025 · 별도 · 시연용 예시값'}</dd><dt>근거·확인상태</dt><dd>${r.revenue===null?'운영법인 또는 공개 연간 실적 확인 필요':'실서비스에서는 원문 URL·확인일 연결'}</dd><dt>예상계약금액</dt><dd>${d?money(d.value):'영업 등록 전'}</dd></dl></section><section class="gv-section"><h3>메모</h3><textarea id="gv-memo" aria-label="${esc(r.name)} 메모" placeholder="다음 사람이 이어서 볼 수 있게 기록">${esc(r.memo)}</textarea><div class="gv-note-actions"><button id="gv-save-memo">메모 저장</button></div></section><section class="gv-section"><h3>커뮤니케이션 · 변경 이력</h3><div class="gv-history-item"><time>13:40</time><div>${esc(r.comm==='고객 회신'?'고객 수신 · 상담 일정 회신':'우리 발신 · 소개자료 안내')}<div class="gv-muted gv-small">예시 커뮤니케이션 · 발송 기능 미연결</div></div></div><div class="gv-history-item"><time>13:20</time><div>담당자 ${esc(r.owner)}<div class="gv-muted gv-small">다음 행동: ${esc(r.next)}</div></div></div>${ui.history.filter(h=>h.startsWith(r.name+' ·')).slice(0,2).map(h=>`<div class="gv-history-item"><time>방금</time><div>${esc(h)}</div></div>`).join('')}</section>`;detail.style.position=design.detail==='하단 펼치기'?'relative':'';detail.style.top=design.detail==='하단 펼치기'?'auto':'';detail.style.width=design.detail==='하단 펼치기'?'100%':'';detail.querySelector('[data-close-detail]').onclick=closeDetail;detail.querySelector('#gv-save-memo').onclick=()=>{r.memo=detail.querySelector('#gv-memo').value;toast('시안에 메모를 저장했습니다.');save()};icons()}
function importPreview(){openDialog('엑셀 가져오기 · 열 매핑',`<p>실제 파일을 업로드하지 않는 미리보기입니다.<br>원본은 보관하고, 미리보기 검증 후에만 반영합니다.</p><div class="gv-table-wrap"><table style="min-width:0" aria-label="열 매핑 예시"><thead><tr><th>엑셀 열</th><th>연결할 필드</th></tr></thead><tbody><tr><td>업체명</td><td>회사·브랜드명</td></tr><tr><td>메일주소</td><td>연락처 이메일</td></tr><tr><td>가입일자</td><td>유입일시</td></tr><tr><td>연매출</td><td>자기신고 매출 · 출처 구분</td></tr></tbody></table></div><p style="margin-top:14px">회사명만 같은 행은 자동 병합하지 않습니다. 오류·중복 후보도 행 번호와 사유를 남깁니다.</p><div class="gv-form-row"><button data-close>닫기</button></div>`)}
root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{ui.page=b.dataset.page;closeDetail();render();save()});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.open&&ui.detail)closeDetail()});
const saved=window.openai?.widgetState?.privateContent;if(saved&&['database','pipeline','activities','connections'].includes(saved.page))ui.page=saved.page;
window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent;if(saved?.page&&['database','pipeline','activities','connections'].includes(saved.page)){ui.page=saved.page;render()}});
render();if(typeof Tweak!=='undefined'){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'목록 밀도',options:['기본','압축']});tweak.addSelect(design,'detail',{label:'상세 열기',options:['우측 패널','하단 펼치기']})}
})();
</script>
